<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)" filter="url(#shadow)">
    <!-- Base House -->
    <path d="M256 80 L90 230 L130 230 L130 420 L210 420 L210 320 Q210 290 256 290 Q302 290 302 320 L302 420 L382 420 L382 230 L422 230 Z" fill="url(#grad-primary)" />
    <!-- Overlapping Community House/Shield -->
    <path d="M256 160 L140 260 L170 260 L170 380 L342 380 L342 260 L372 260 Z" fill="url(#grad-accent)" opacity="0.9" />
    <!-- Center connection point -->
    <circle cx="256" cy="300" r="24" fill="#ffffff" />
  </g>
</svg>
